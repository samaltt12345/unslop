# GeoMaster Render Blueprint
# Create it with: Render Dashboard → New + → Blueprint → select this repository.
# Docker prevents Render from ever misidentifying this Next.js app as Python.

databases:
  - name: geomaster-db
    databaseName: geomaster
    plan: free

services:
  - type: web
    name: geomaster
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geomaster-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
